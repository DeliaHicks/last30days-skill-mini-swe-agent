name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}


jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --locked
      - name: Run full test suite with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=84

  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --locked
      - name: Run offline research-quality evaluation
        run: uv run pytest tests/eval -x -s

  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Run MCP tests with race detection
        working-directory: mcp
        run: go test -race ./...
